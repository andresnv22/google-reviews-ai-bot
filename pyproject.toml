[project]
name = "google-reviews-ai-bot"
version = "1.0.0"
description = "Google Business Profile reviews bot: fetches unanswered reviews, generates AI replies, and posts via GBP API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
